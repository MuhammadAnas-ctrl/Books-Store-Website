<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="checkout.css">
    <title>CheckOut</title>
</head>
<body>
    

<h1>Checkout Form</h1>
    <h3>Complete Your Order On WhatsApp📦</h3>
<div class="row">
  <div class="col-75">
    <div class="container">
      
        <div class="row">
          <div class="col-50">
            <h3>Billing Address</h3>
            <form>
            <label for="fname"><i class="fa fa-user"></i> Full Name</label>
            <input type="name" id="name" name="firstname" placeholder="John M. Doe" required>
            <label for="phone"><i class="fa fa-institution"></i> Phone</label>
            <input type="phone" id="phone" name="city" placeholder="Phone Number" required>
            <label for="adr"><i class="fa fa-address-card-o"></i> Address</label>
            <input type="Address" id="address" name="address" placeholder="542 W. 15th Street" required>
            <label for="city"><i class="fa fa-institution"></i> City</label>
            <input type="city" id="city" name="city" placeholder="New York" required>
          </div>
            </form>

         <h2>Your Cart</h2>
           <div id="cartItems"></div>
            
        </div>
        <button type="submit" class="btn" id="btn" onclick="SetInStorage()">Submit</button>

    </div>
  </div>
</div>






<script src="https://kit.fontawesome.com/f497a2fd00.js" crossorigin="anonymous"></script>
<script>
    function SetInStorage() {
  // e.preventDeafult();
  let name = document.getElementById("name");
  let email = document.getElementById("email");
  let phone = document.getElementById("phone");
  let address = document.getElementById("adr");
  let city = document.getElementById("city");
  let btn = document.getElementById("btn");

  localStorage.setItem("name", name.value);
  localStorage.setItem("email", email.value);
  localStorage.setItem("phone", phone.value);
  localStorage.setItem("adr", address.value);
  localStorage.setItem("city", city.value);

//   let get = localStorage.getItem("name");
//   console.log(get);

let getname = localStorage.getItem("name")
let getemail = localStorage.getItem("email")
let getphone = localStorage.getItem("phone")
let getadr = localStorage.getItem("adr")
let getcity = localStorage.getItem("city")
    </script>
</body>
</html>
