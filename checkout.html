<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="checkout.css">
    <title>CheckOut</title>
</head>
<body>
    

<h1>Checkout Form</h1>
    <h3><bold>Complete Your Order On WhatsApp</bold></h3>
<div class="row">
  <div class="col-75">
    <div class="container">
      
        <div class="row">
          <div class="col-50">
            <h3>Billing Address</h3>
            <form>
            <label for="fname"><i class="fa fa-user"></i> Full Name</label>
            <input type="name" id="name" name="firstname" placeholder="John M. Doe" required>
            <label for="phone"><i class="fa fa-institution"></i> Phone</label>
            <input type="phone" id="phone" name="city" placeholder="Phone Number" required>
            <label for="adr"><i class="fa fa-address-card-o"></i> Address</label>
            <input type="Address" id="address" name="address" placeholder="542 W. 15th Street" required>
            <label for="city"><i class="fa fa-institution"></i> City</label>
            <input type="city" id="city" name="city" placeholder="New York" required>
          </div>
            <div class="checkoutContainer">
  <div class="checkoutHeader">
    <div class="headerBook">Book</div>
    <div class="headerQuantity">Quantity</div>
    <div class="headerAction">Action</div>
  </div>
  <ul class="checkoutList">
    <!-- Cart items will appear here -->
  </ul>
  <div class="checkoutTotal">
    <!-- Total price will appear here -->
  </div>
            </div>
        </form>

            
        </div>
        <button type="submit" onclick="placeOrder()"  id="placeOrderBtn" class="btn-whatsapp">💬 Place Order on WhatsApp</button>
        
  </div>
</div>






<script src="https://kit.fontawesome.com/f497a2fd00.js" crossorigin="anonymous"></script>
<script src="checkout.js"></script>
    
</body>
</html>
