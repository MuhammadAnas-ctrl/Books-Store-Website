<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>The Book Shop</title>
</head>
<body>
<div class="container">
    <header>
        <h2>The Book Shop</h2>
            <div class="shoppingBasket">
                <i class="fa fa-cart-shopping fa-xl" id="carticon"></i>
                <span class="quantity">0</span>
        </div>
    </header>

<section class="hero-section">
  <div class="hero-overlay">
    <div class="hero-content">
      <h1 class="hero-title">Your Favorite Books, <br><span>Delivered via WhatsApp</span></h1>
      <p class="hero-subtitle">Browse our curated collection and order in seconds. Fast, simple, and mobile-friendly.</p>
      <div class="hero-btns">
        <a href="#collection" class="btn-coffee">Shop Collection</a>
        <a href="https://wa.me/YOURNUMBER" class="btn-coffee">Chat With Us</a>
      </div>
    </div>
  </div>
</section>

<div class="search-container">
  <div class="search-box">
    <span class="search-emoji">🔍</span>
    <input type="text" class="search-input" placeholder="Find your next favorite book...">
    
  </div>
</div>
    
    <div class="products"></div>
</div>
<div class="cartOverlay">
  <div class="cartContent">
    <h3 class="cartTitle">Your Cart</h3>
    <hr>
    <ul class="productList">
      <!-- Cart items will appear here -->
    </ul>

    <div class="cartFooter">
      <div class="total">
        <small>Subtotal (0 items)</small> ₹0
      </div>
      <button type="button" class="checkk">CheckOut</button>
      <button class="close">Close</button>
    </div>
  </div>
</div>





<script src="https://kit.fontawesome.com/f497a2fd00.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>

</body>
</html>
